<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="b6-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2B160C"/>
      <stop offset="60%" stop-color="#140803"/>
      <stop offset="100%" stop-color="#080301"/>
    </radialGradient>
    <linearGradient id="b6-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE5BF"/>
      <stop offset="50%" stop-color="#D9A865"/>
      <stop offset="100%" stop-color="#7A4B1A"/>
    </linearGradient>
    <filter id="b6-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#b6-bg)"/>

  <!-- Enterprise Data Center Server Racks in 3D Perspective -->
  <g opacity="0.25" stroke="#D9A865" stroke-width="1.5">
    <!-- Server Rack Lines -->
    <path d="M1200,100 L1200,980 M1380,100 L1380,980 M1560,100 L1560,980 M1740,100 L1740,980"/>
    <!-- Blade Shelves -->
    <path d="M1150,200 L1850,200 M1150,300 L1850,300 M1150,400 L1850,400 M1150,500 L1850,500 M1150,600 L1850,600 M1150,700 L1850,700 M1150,800 L1850,800 M1150,900 L1850,900" stroke-dasharray="8 6"/>
  </g>

  <!-- Server Blinking LEDs in racks -->
  <g transform="translate(1220, 220)">
    <circle cx="10" cy="0" r="3" fill="#00FF66" filter="url(#b6-glow)"/>
    <circle cx="25" cy="0" r="3" fill="#00FF66"/>
    <circle cx="40" cy="0" r="3" fill="#FFCC00"/>
    <circle cx="190" cy="0" r="3" fill="#00FF66"/>
    <circle cx="205" cy="0" r="3" fill="#00FF66"/>

    <circle cx="10" cy="100" r="3" fill="#00FF66"/>
    <circle cx="25" cy="100" r="3" fill="#00FF66"/>
    <circle cx="190" cy="100" r="3" fill="#00FF66"/>

    <circle cx="10" cy="200" r="3" fill="#00FF66"/>
    <circle cx="190" cy="200" r="3" fill="#FF3333"/>
  </g>

  <!-- Big 25-Year Milestone Career Road Timeline Graphic -->
  <g transform="translate(900, 320)">
    <!-- Roadmap Spine -->
    <line x1="50" y1="200" x2="900" y2="200" stroke="url(#b6-gold)" stroke-width="4" filter="url(#b6-glow)"/>

    <!-- Milestone 1: 1999 Enterprise Systems -->
    <g transform="translate(100, 200)">
      <circle cx="0" cy="0" r="16" fill="url(#b6-gold)"/>
      <circle cx="0" cy="0" r="6" fill="#140803"/>
      <rect x="-80" y="-120" width="160" height="90" rx="10" fill="#1C0E07" stroke="#D9A865" stroke-width="1.5"/>
      <text x="0" y="-95" fill="#FCE5BF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">1999 - 2007</text>
      <text x="0" y="-75" fill="#D9A865" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Enterprise Systems</text>
      <text x="0" y="-55" fill="#A88B73" font-family="sans-serif" font-size="10" text-anchor="middle">Oracle DB • C/C++ • Core IT</text>
    </g>

    <!-- Milestone 2: 2008 Tier-1 Banking ERPs -->
    <g transform="translate(320, 200)">
      <circle cx="0" cy="0" r="16" fill="url(#b6-gold)"/>
      <circle cx="0" cy="0" r="6" fill="#140803"/>
      <rect x="-80" y="30" width="160" height="90" rx="10" fill="#1C0E07" stroke="#D9A865" stroke-width="1.5"/>
      <text x="0" y="55" fill="#FCE5BF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">2008 - 2015</text>
      <text x="0" y="75" fill="#D9A865" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Tier-1 Banking ERPs</text>
      <text x="0" y="95" fill="#A88B73" font-family="sans-serif" font-size="10" text-anchor="middle">Oracle EBS • SAP S/4HANA</text>
    </g>

    <!-- Milestone 3: 2016 Cloud Transformation -->
    <g transform="translate(540, 200)">
      <circle cx="0" cy="0" r="16" fill="url(#b6-gold)"/>
      <circle cx="0" cy="0" r="6" fill="#140803"/>
      <rect x="-80" y="-120" width="160" height="90" rx="10" fill="#1C0E07" stroke="#D9A865" stroke-width="1.5"/>
      <text x="0" y="-95" fill="#FCE5BF" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">2016 - 2023</text>
      <text x="0" y="-75" fill="#D9A865" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Cloud & Microservices</text>
      <text x="0" y="-55" fill="#A88B73" font-family="sans-serif" font-size="10" text-anchor="middle">AWS • Kubernetes • DevOps</text>
    </g>

    <!-- Milestone 4: 2024+ Frontier AI & Automation -->
    <g transform="translate(760, 200)">
      <circle cx="0" cy="0" r="22" fill="#00FF66" filter="url(#b6-glow)"/>
      <circle cx="0" cy="0" r="8" fill="#140803"/>
      <rect x="-90" y="30" width="180" height="90" rx="10" fill="#1C0E07" stroke="#00FF66" stroke-width="2"/>
      <text x="0" y="55" fill="#00FF66" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">2024 - 2026+</text>
      <text x="0" y="75" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Autonomous AI Swarms</text>
      <text x="0" y="95" fill="#A88B73" font-family="sans-serif" font-size="10" text-anchor="middle">Claude 3.7 • AGY • Media Hub</text>
    </g>
  </g>

  <!-- LinkedIn & Credentials Verified Seal -->
  <g transform="translate(1480, 720)">
    <rect width="360" height="180" rx="16" fill="#1C0E07" stroke="#D9A865" stroke-width="1.5"/>
    <text x="30" y="45" fill="#0A66C2" font-family="sans-serif" font-weight="bold" font-size="20">in Verified Chief Architect</text>
    <text x="30" y="75" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="18">Yasir Islam Butt</text>
    <text x="30" y="100" fill="#D9A865" font-family="sans-serif" font-size="13">25+ Years Enterprise IT Leadership</text>
    <text x="30" y="135" fill="#A88B73" font-family="monospace" font-size="12">linkedin.com/in/yasirislambutt</text>
  </g>
</svg>