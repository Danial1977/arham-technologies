<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="b8-bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2B170D"/>
      <stop offset="60%" stop-color="#140803"/>
      <stop offset="100%" stop-color="#080301"/>
    </radialGradient>
    <linearGradient id="b8-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0D4"/>
      <stop offset="50%" stop-color="#D9A662"/>
      <stop offset="100%" stop-color="#7A4B1A"/>
    </linearGradient>
    <filter id="b8-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#b8-bg)"/>

  <!-- World Globe Grid Wireframe -->
  <g opacity="0.2" stroke="#D9A662" stroke-width="1.5" fill="none" transform="translate(1400, 500)">
    <circle cx="0" cy="0" r="320"/>
    <ellipse cx="0" cy="0" rx="320" ry="120"/>
    <ellipse cx="0" cy="0" rx="320" ry="220"/>
    <ellipse cx="0" cy="0" rx="120" ry="320"/>
    <ellipse cx="0" cy="0" rx="220" ry="320"/>
    <line x1="-320" y1="0" x2="320" y2="0"/>
    <line x1="0" y1="-320" x2="0" y2="320"/>
  </g>

  <!-- Transatlantic High-Speed Fiber Arc (UK London <-> USA NYC / Silicon Valley) -->
  <g transform="translate(920, 260)">
    <!-- Arc Line -->
    <path d="M100,320 Q450,80 800,280" fill="none" stroke="url(#b8-gold)" stroke-width="4" filter="url(#b8-glow)"/>
    <path d="M100,320 Q450,80 800,280" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="10 8"/>

    <!-- USA Node (New York / Silicon Valley) -->
    <g transform="translate(100, 320)">
      <circle cx="0" cy="0" r="20" fill="url(#b8-gold)" filter="url(#b8-glow)"/>
      <circle cx="0" cy="0" r="8" fill="#140803"/>
      <rect x="-100" y="35" width="200" height="85" rx="10" fill="#1C0E07" stroke="#D9A662" stroke-width="1.5"/>
      <text x="0" y="60" fill="#FFF0D4" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">USA & SILICON VALLEY</text>
      <text x="0" y="80" fill="#D9A662" font-family="sans-serif" font-size="12" text-anchor="middle">Fortune 500 Enterprise</text>
      <text x="0" y="100" fill="#A88B73" font-family="monospace" font-size="11" text-anchor="middle">SOC-2 Type II Certified</text>
    </g>

    <!-- UK Node (London Canary Wharf) -->
    <g transform="translate(800, 280)">
      <circle cx="0" cy="0" r="20" fill="url(#b8-gold)" filter="url(#b8-glow)"/>
      <circle cx="0" cy="0" r="8" fill="#140803"/>
      <rect x="-100" y="35" width="200" height="85" rx="10" fill="#1C0E07" stroke="#D9A662" stroke-width="1.5"/>
      <text x="0" y="60" fill="#FFF0D4" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">LONDON & UK HUB</text>
      <text x="0" y="80" fill="#D9A662" font-family="sans-serif" font-size="12" text-anchor="middle">FTSE 100 Financials</text>
      <text x="0" y="100" fill="#A88B73" font-family="monospace" font-size="11" text-anchor="middle">GDPR & ISO 27001 Compliant</text>
    </g>
  </g>

  <!-- Big Trust & Delivery Crest Floating Right -->
  <g transform="translate(1360, 680)">
    <rect width="480" height="240" rx="16" fill="#1A0D06" stroke="#D9A662" stroke-width="1.5"/>
    <text x="30" y="45" fill="#D9A662" font-family="monospace" font-size="13" letter-spacing="2">GLOBAL DELIVERY SLA ASSURANCE</text>
    <line x1="30" y1="60" x2="450" y2="60" stroke="#3D2214" stroke-width="1"/>

    <g transform="translate(30, 95)">
      <text x="0" y="0" fill="#00FF99" font-family="sans-serif" font-size="36" font-weight="extrabold">99.8%</text>
      <text x="0" y="25" fill="#FFF" font-family="sans-serif" font-size="13">Mission-Critical Uptime SLA</text>
    </g>

    <g transform="translate(240, 95)">
      <text x="0" y="0" fill="#FFF0D4" font-family="sans-serif" font-size="36" font-weight="extrabold">12+</text>
      <text x="0" y="25" fill="#FFF" font-family="sans-serif" font-size="13">Global Enterprise Partners</text>
    </g>

    <line x1="30" y1="160" x2="450" y2="160" stroke="#3D2214" stroke-width="1"/>
    <text x="30" y="195" fill="#A88B73" font-family="monospace" font-size="12">🛡️ STRICT ENTERPRISE NDA • 24/7 FOLLOW-THE-SUN SUPPORT</text>
  </g>
</svg>