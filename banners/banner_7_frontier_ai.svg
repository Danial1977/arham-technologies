<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="b7-bg" cx="65%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#331A0D"/>
      <stop offset="50%" stop-color="#1A0D06"/>
      <stop offset="100%" stop-color="#0A0401"/>
    </radialGradient>
    <linearGradient id="b7-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE7C4"/>
      <stop offset="50%" stop-color="#E0AC68"/>
      <stop offset="100%" stop-color="#8A571E"/>
    </linearGradient>
    <linearGradient id="grok-electric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF"/>
      <stop offset="50%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="b7-glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#b7-bg)"/>

  <!-- Volumetric Generative Video Rays (Google VEO 3 Camera Aperture) -->
  <g transform="translate(1400, 480)">
    <!-- Aperture Blades -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="#E0AC68" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#FFE7C4" stroke-width="3" filter="url(#b7-glow)"/>
    <circle cx="0" cy="0" r="100" fill="#24140B" stroke="#E0AC68" stroke-width="4"/>
    <circle cx="0" cy="0" r="50" fill="url(#b7-gold)" filter="url(#b7-glow)"/>

    <!-- Light Rays Emitters -->
    <g opacity="0.3" stroke="url(#b7-gold)" stroke-width="2">
      <line x1="0" y1="0" x2="-600" y2="-300"/>
      <line x1="0" y1="0" x2="-650" y2="-150"/>
      <line x1="0" y1="0" x2="-700" y2="0"/>
      <line x1="0" y1="0" x2="-650" y2="150"/>
      <line x1="0" y1="0" x2="-600" y2="300"/>
    </g>

    <text x="0" y="8" fill="#140803" font-family="sans-serif" font-weight="black" font-size="22" text-anchor="middle">VEO 3</text>
  </g>

  <!-- Grok Real-Time Signals & Lightning Nodes -->
  <g transform="translate(1000, 200)" opacity="0.9">
    <polygon points="120,40 180,40 140,110 200,110 90,240 120,130 60,130" fill="url(#grok-electric)" filter="url(#b7-glow)"/>
    <text x="220" y="110" fill="#FFF" font-family="sans-serif" font-weight="extrabold" font-size="28">xAI Grok Signal Engine</text>
    <text x="220" y="135" fill="#E0AC68" font-family="monospace" font-size="14">Real-time social pulse ingestion</text>
  </g>

  <!-- Telemetry HUD Card -->
  <g transform="translate(980, 560)">
    <rect width="480" height="260" rx="16" fill="#1A0D06" stroke="#E0AC68" stroke-width="1.5" opacity="0.95"/>
    <text x="30" y="45" fill="#E0AC68" font-family="monospace" font-size="13" letter-spacing="2">FRONTIER MODEL TELEMETRY // 2026</text>
    <line x1="30" y1="60" x2="450" y2="60" stroke="#3D2214" stroke-width="1"/>

    <g transform="translate(30, 85)">
      <circle cx="15" cy="15" r="10" fill="#FF4500"/>
      <text x="35" y="15" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">Google VEO 3 Cinematic Studio</text>
      <text x="35" y="32" fill="#A88B73" font-family="sans-serif" font-size="11">Physics-informed 4K generative video synthesis</text>
    </g>

    <g transform="translate(30, 140)">
      <circle cx="15" cy="15" r="10" fill="#FFB347"/>
      <text x="35" y="15" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">xAI Grok Real-Time Signals</text>
      <text x="35" y="32" fill="#A88B73" font-family="sans-serif" font-size="11">Sub-second event stream trend syndication</text>
    </g>

    <g transform="translate(30, 195)">
      <circle cx="15" cy="15" r="10" fill="#00FF99"/>
      <text x="35" y="15" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="14">Claude 3.7 & AGY Reasoning Swarms</text>
      <text x="35" y="32" fill="#A88B73" font-family="sans-serif" font-size="11">Multi-step agentic execution & self-healing code</text>
    </g>
  </g>
</svg>