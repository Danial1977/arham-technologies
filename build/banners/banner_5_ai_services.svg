<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="b5-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2E1B10"/>
      <stop offset="60%" stop-color="#160B05"/>
      <stop offset="100%" stop-color="#0B0502"/>
    </radialGradient>
    <linearGradient id="b5-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E2BE"/>
      <stop offset="50%" stop-color="#D4A76A"/>
      <stop offset="100%" stop-color="#805423"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38E1FF"/>
      <stop offset="100%" stop-color="#006699"/>
    </linearGradient>
    <filter id="b5-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#b5-bg)"/>

  <!-- Circuit Blueprint Pattern -->
  <g opacity="0.15" stroke="#D4A76A" stroke-width="1.5" fill="none">
    <path d="M100,100 L300,100 L400,200 L800,200 L900,100 L1800,100"/>
    <path d="M200,900 L500,900 L600,800 L1200,800 L1300,900 L1800,900"/>
    <path d="M960,100 L960,400 M960,600 L960,1000"/>
    <circle cx="400" cy="200" r="5" fill="#D4A76A"/>
    <circle cx="800" cy="200" r="5" fill="#D4A76A"/>
    <circle cx="600" cy="800" r="5" fill="#D4A76A"/>
    <circle cx="1200" cy="800" r="5" fill="#D4A76A"/>
  </g>

  <!-- Central Visual Diagram: 4 Floating Architectural Quadrants -->
  <g transform="translate(980, 220)">
    
    <!-- Quadrant 1: Autonomous Agent Swarms (Top Left) -->
    <g transform="translate(0, 0)">
      <rect width="400" height="260" rx="16" fill="#1C0E07" stroke="#D4A76A" stroke-width="1.5" opacity="0.95"/>
      <rect x="20" y="20" width="48" height="48" rx="10" fill="url(#b5-gold)"/>
      <text x="35" y="52" fill="#140803" font-family="sans-serif" font-weight="bold" font-size="24">🤖</text>
      <text x="85" y="42" fill="#F5E2BE" font-family="sans-serif" font-weight="bold" font-size="18">Autonomous Swarms</text>
      <text x="85" y="62" fill="#D4A76A" font-family="monospace" font-size="12">Claude 3.7 + AGY Multi-Agent</text>
      <line x1="20" y1="85" x2="380" y2="85" stroke="#3D2214" stroke-width="1"/>
      <text x="25" y="120" fill="#A88B73" font-family="monospace" font-size="13">► Dynamic Tool Calling & Reasoning</text>
      <text x="25" y="150" fill="#A88B73" font-family="monospace" font-size="13">► Self-Healing CI/CD Auto-Remediation</text>
      <text x="25" y="180" fill="#A88B73" font-family="monospace" font-size="13">► Multi-Persona Collaborative Loops</text>
      <text x="25" y="210" fill="#A88B73" font-family="monospace" font-size="13">► Deep Research & Synthesis Trees</text>
    </g>

    <!-- Quadrant 2: Cloud & Kubernetes Mesh (Top Right) -->
    <g transform="translate(440, 0)">
      <rect width="400" height="260" rx="16" fill="#1C0E07" stroke="#38E1FF" stroke-width="1.5" opacity="0.95"/>
      <rect x="20" y="20" width="48" height="48" rx="10" fill="url(#cyanGrad)"/>
      <text x="35" y="52" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="24">☁</text>
      <text x="85" y="42" fill="#E6F9FF" font-family="sans-serif" font-weight="bold" font-size="18">Enterprise Cloud & K8s</text>
      <text x="85" y="62" fill="#38E1FF" font-family="monospace" font-size="12">AWS • GCP • Hybrid Datacenter</text>
      <line x1="20" y1="85" x2="380" y2="85" stroke="#16384C" stroke-width="1"/>
      <text x="25" y="120" fill="#88B8D0" font-family="monospace" font-size="13">► Distributed Kubernetes Pod Swarms</text>
      <text x="25" y="150" fill="#88B8D0" font-family="monospace" font-size="13">► Zero-Trust IAM & VPC Architecture</text>
      <text x="25" y="180" fill="#88B8D0" font-family="monospace" font-size="13">► Multi-Region Failover & Replication</text>
      <text x="25" y="210" fill="#88B8D0" font-family="monospace" font-size="13">► Sub-Millisecond Redis/Valkey Cache</text>
    </g>

    <!-- Quadrant 3: Media Automation Engine (Bottom Left) -->
    <g transform="translate(0, 300)">
      <rect width="400" height="260" rx="16" fill="#1C0E07" stroke="#D4A76A" stroke-width="1.5" opacity="0.95"/>
      <rect x="20" y="20" width="48" height="48" rx="10" fill="url(#b5-gold)"/>
      <text x="35" y="52" fill="#140803" font-family="sans-serif" font-weight="bold" font-size="24">🎬</text>
      <text x="85" y="42" fill="#F5E2BE" font-family="sans-serif" font-weight="bold" font-size="18">Media & Content Engine</text>
      <text x="85" y="62" fill="#D4A76A" font-family="monospace" font-size="12">Remotion • FFmpeg • ElevenLabs</text>
      <line x1="20" y1="85" x2="380" y2="85" stroke="#3D2214" stroke-width="1"/>
      <text x="25" y="120" fill="#A88B73" font-family="monospace" font-size="13">► Automated YouTube & Facebook Streams</text>
      <text x="25" y="150" fill="#A88B73" font-family="monospace" font-size="13">► Synthetic Voice & Script Gen Pipeline</text>
      <text x="25" y="180" fill="#A88B73" font-family="monospace" font-size="13">► Dynamic Thumbnail Rendering A/B</text>
      <text x="25" y="210" fill="#A88B73" font-family="monospace" font-size="13">► Automated Multi-Channel Publishing</text>
    </g>

    <!-- Quadrant 4: Modernization & High-Throughput Web (Bottom Right) -->
    <g transform="translate(440, 300)">
      <rect width="400" height="260" rx="16" fill="#1C0E07" stroke="#D4A76A" stroke-width="1.5" opacity="0.95"/>
      <rect x="20" y="20" width="48" height="48" rx="10" fill="url(#b5-gold)"/>
      <text x="35" y="52" fill="#140803" font-family="sans-serif" font-weight="bold" font-size="24">⚡</text>
      <text x="85" y="42" fill="#F5E2BE" font-family="sans-serif" font-weight="bold" font-size="18">High-Velocity Engineering</text>
      <text x="85" y="62" fill="#D4A76A" font-family="monospace" font-size="12">Next.js 15 • React • Prisma • SQL</text>
      <line x1="20" y1="85" x2="380" y2="85" stroke="#3D2214" stroke-width="1"/>
      <text x="25" y="120" fill="#A88B73" font-family="monospace" font-size="13">► Server-Side Rendering (SSR) & Edge</text>
      <text x="25" y="150" fill="#A88B73" font-family="monospace" font-size="13">► Enterprise E-Commerce Portals</text>
      <text x="25" y="180" fill="#A88B73" font-family="monospace" font-size="13">► Real-Time Stock & Inventory Feeds</text>
      <text x="25" y="210" fill="#A88B73" font-family="monospace" font-size="13">► 100/100 Core Web Vitals Optimization</text>
    </g>

    <!-- Central Interconnection Hub -->
    <circle cx="420" cy="280" r="30" fill="url(#b5-gold)" filter="url(#b5-glow)"/>
    <text x="408" y="287" fill="#140803" font-family="sans-serif" font-weight="extrabold" font-size="20">AI</text>
  </g>
</svg>